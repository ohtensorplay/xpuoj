name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Verify release version
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/xpuoj/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Publish
        run: npm publish --workspace @tensorplay/xpuoj --access public

  sync-mega:
    name: Sync MCP to MEGA
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Sync MCP distribution
        uses: ohtensorplay/hub-sync@v1
        with:
          mega_repo_id: mega/xpuoj
          mega_oidc_resource: mega
          repo_type: mcp
          include: |
            README.md
            .agents/plugins/marketplace.json
            plugins/xpuoj/**
