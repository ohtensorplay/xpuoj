name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Verify release version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Publish
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if npm view "@tensorplay/xpuoj@$package_version" version >/dev/null 2>&1; then
            echo "@tensorplay/xpuoj@$package_version is already published"
          else
            npm publish --access public
          fi
